# CI-1 — the gate that stops a bad merge.
#
# TYPE-GATE enforced rather than remembered: `npm run build` is the SAME command
# Cloudflare Pages runs (`tsc -b && vite build`), so CI and the deploy share one
# gate. The 2026-09-23 failure — two TypeScript errors in test files — went
# unnoticed for two merges precisely because `npm test` alone never type-checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # the version pinned in the repo, which is what Pages builds with
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # THE gate. Runs tsc -b first, exactly as Pages does.
      - name: npm run build (the same command Pages runs)
        run: npm run build

      - run: npm test

  publish-sha:
    # DRIFT-ALARM reads this instead of the GitHub API, so the box needs no
    # GitHub credential to learn what main's head is.
    name: publish main sha to SSM
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC only — there is no long-lived AWS key here
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::095652687153:role/gh-gym-display-ssm-writer
          aws-region: us-east-1
      - name: put /artemis/gym-display/main-sha
        run: |
          aws ssm put-parameter \
            --name /artemis/gym-display/main-sha \
            --type String \
            --overwrite \
            --value "$GITHUB_SHA" \
            --description "gym-display main head, written by CI on push"
          aws ssm get-parameter --name /artemis/gym-display/main-sha \
            --query 'Parameter.[Value,LastModifiedDate]' --output text
